# Copy this file to application-secret.yaml and replace every placeholder.
# application-secret.yaml is local-only and must never be committed.
spring:
  datasource:
    url: jdbc:mysql://DB_HOST:3306/DB_NAME?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
          naver:
            client-id: YOUR_NAVER_CLIENT_ID
            client-secret: YOUR_NAVER_CLIENT_SECRET
          kakao:
            client-id: YOUR_KAKAO_REST_API_KEY
            client-secret: YOUR_KAKAO_CLIENT_SECRET

  # ── 메일(비밀번호 재설정, 계약 §4-4) ──────────────────────────────────
  # 이 블록은 app.mail.mode=smtp 일 때만 필요하다. 기본값은 log(콘솔 출력)라
  # 이 블록이 없어도 애플리케이션은 정상 부팅된다.
  #
  # ⚠️ mode=smtp 로 켜면서 이 블록을 빠뜨리면 JavaMailSender 빈이 없어
  #    "no qualifying bean of type JavaMailSender"로 부팅이 실패한다.
  #    둘은 항상 같이 넣고 같이 뺀다.
  #
  # Gmail은 계정 비밀번호가 아니라 앱 비밀번호를 쓴다
  # (Google 계정 → 보안 → 2단계 인증 → 앱 비밀번호에서 발급).
  # 켜는 법: clov-api.env 에 APP_MAIL_MODE=smtp  (기본 발신자는 APP_MAIL_FROM)
  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_SMTP_USERNAME       # 보통 발신 계정 주소
    password: YOUR_SMTP_APP_PASSWORD   # secret — 계정 비밀번호가 아니다
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  issuer: clov-api
  secret: YOUR_BASE64_JWT_SECRET

# Object storage (Cloudflare R2, S3-compatible). Values are local-only secrets.
app:
  storage:
    endpoint: https://YOUR_R2_ACCOUNT_ID.r2.cloudflarestorage.com
    region: auto                      # R2 requires the literal "auto"
    bucket: clov-media
    access-key: YOUR_R2_ACCESS_KEY_ID       # secret
    secret-key: YOUR_R2_SECRET_ACCESS_KEY   # secret
    public-base-url: https://pub-YOUR_HASH.r2.dev/   # trailing slash required
