spring:
  application:
    name: clov-api
  datasource:
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  profiles:
    # group에 자기 자신(dev/prod)을 다시 넣지 않는다 — 활성화된 시점에 이미 활성 프로필이라 중복이다.
    # `include: secret`도 두지 않는다. group이 secret을 포함하므로 중복이고, include는 프로필과
    # 무관하게 항상 켜져서 "프로필을 안 줘도 뜨는" 상태를 만든다.
    # ⚠️ 그래서 활성 프로필이 반드시 하나는 있어야 시크릿을 읽는다. 로컬은 아래 active: dev가,
    #    운영은 clov-api.env의 SPRING_PROFILES_ACTIVE=prod가 그 역할을 한다.
    # db는 아직 application-db.yaml이 없어 no-op이다(DB 설정 분리가 필요해지면 그때 추가).
    group:
      dev: [dev, db, secret]
      prod: [prod, db, secret]
    active: dev

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            # {baseUrl}은 Spring Security 내장 플레이스홀더 — 요청이 들어온 실제 scheme+host로 매 요청 계산된다.
            # 아래 server.forward-headers-strategy: framework가 nginx의 X-Forwarded-*를 신뢰하게 해줘서,
            # clovlabcalss.store·clovlov.xyz 등 여러 도메인을 env var 없이 동시에 지원한다(#147).
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: openid, profile, email
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope: name, email
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope: profile_nickname, account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  # nginx 리버스 프록시 뒤에서 X-Forwarded-Proto/Host를 신뢰(HTTPS 스킴·호스트 인식). OAuth 리다이렉트·보안 쿠키에 필요.
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # log = 재설정 링크를 콘솔에만 출력(기본) · smtp = 실제 발송
    # ⚠️ 기본값이 log인 것은 의도적이다 — 메일 설정이 없는 서버에 배포돼도 부팅이 깨지지 않는다.
    #    SMTP 계정이 준비되면 clov-api.env에 APP_MAIL_MODE=smtp를 넣고
    #    application-secret.yaml에 spring.mail.host/username/password를 추가한다(코드 수정 불필요).
    mode: ${APP_MAIL_MODE:log}
    from: ${APP_MAIL_FROM:no-reply@clovlabcalss.store}
  storage:
    # 실제 값은 application-secret.yaml(로컬 전용)에서 주입한다. R2는 region=auto.
    endpoint: ${APP_STORAGE_ENDPOINT:}
    region: ${APP_STORAGE_REGION:auto}
    bucket: ${APP_STORAGE_BUCKET:clov-media}
    access-key: ${APP_STORAGE_ACCESS_KEY:}
    secret-key: ${APP_STORAGE_SECRET_KEY:}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.korit.clovapi.domain.auth.entity,com.korit.clovapi.domain.room.entity,com.korit.clovapi.domain.invite.entity,com.korit.clovapi.domain.plan.entity,com.korit.clovapi.domain.memory.entity,com.korit.clovapi.domain.letter.entity,com.korit.clovapi.domain.notification.entity,com.korit.clovapi.domain.user.entity,com.korit.clovapi.domain.shop.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

---

spring:
  config:
    activate:
      on-profile: dev

client:
  url: http://localhost:5173

app:
  oauth:
    # 로컬은 프론트(5173)·백엔드(8080)가 nginx 없이 분리돼 있어 OAuth2SuccessHandler가
    # request 기준으로 계산하면 백엔드로 되돌아간다(#155). 운영은 이 값이 비어 있어(기본값)
    # 기존 request-relative 동작(#147, 멀티 도메인)을 그대로 쓴다.
    local-frontend-origin: http://localhost:5173
---

spring:
  config:
    activate:
      on-profile: prod

client:
  # 사이트는 certbot으로 HTTPS다. http로 두면 리다이렉트·CORS가 어긋난다.
  url: https://clovlab.store
