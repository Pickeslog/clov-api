plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.korit'
version = '0.0.1-SNAPSHOT'
description = 'clov-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.31.6')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 시크릿 yaml은 배포 산출물(JAR)에 넣지 않는다.
//
// 이 파일들이 src/main/resources에 있는 이유는 로컬 실행(bootRun·IDE) 때 클래스패스에서 읽기
// 위해서다. 배포 VM에서는 JAR 옆 워킹디렉터리의 application-secret.yaml을 Spring이 읽는다
// (deploy/clov-api.service의 WorkingDirectory=/opt/clov-api).
//
// processResources가 아니라 bootJar에서 거르는 이유: processResources에서 빼면
// build/resources/main에도 안 들어가 로컬 실행이 깨진다. JAR만 걸러야 한다.
//
// 패턴을 application-secret*로 넓게 잡은 것은 .gitignore와 같은 이유다 — 2026-07-27에
// application-secret-server.yaml이 앵커된 패턴을 비껴가 커밋에 딸려 들어갈 뻔했다(#79).
tasks.named('bootJar') {
    exclude 'application-secret*.yaml'
    exclude 'application-secret*.yml'
}
